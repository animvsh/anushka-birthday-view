<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Anushka's birthday film and full birthday messages."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='44' y='10' rx='12' fill='%23ff0033'/%3E%3Cpath d='m27 22 16 10-16 10Z' fill='white'/%3E%3C/svg%3E"
    />
    <title>AnushkaTube</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, system-ui, sans-serif;
        background: #fff;
        color: #0f0f0f;
        --red: #ff0033;
        --ink: #0f0f0f;
        --muted: #606060;
        --surface: #f2f2f2;
        --line: #e5e5e5;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        min-height: 100vh;
        margin: 0;
        background: #fff;
        color: var(--ink);
      }

      button,
      a { font: inherit; }

      .skip-link {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 20;
        padding: 10px 14px;
        border-radius: 4px;
        background: #000;
        color: #fff;
        transform: translateY(-150%);
      }

      .skip-link:focus { transform: translateY(0); }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
      }

      .header-inner {
        display: flex;
        width: min(100% - 32px, 1120px);
        min-height: 64px;
        margin: 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--ink);
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 31px;
        height: 22px;
        place-items: center;
        border-radius: 6px;
        background: var(--red);
      }

      .brand-mark::after {
        width: 0;
        height: 0;
        margin-left: 2px;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 8px solid #fff;
        content: "";
      }

      nav a {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
      }

      nav a:hover { color: var(--ink); }

      main {
        width: min(100% - 32px, 1120px);
        margin: 0 auto;
        padding: 40px 0 64px;
      }

      .featured-label {
        margin: 0 0 8px;
        color: var(--red);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p { margin-top: 0; }

      h1 {
        margin-bottom: 20px;
        font-size: clamp(2rem, 5vw, 3.75rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .main-player {
        overflow: hidden;
        border-radius: 14px;
        background: #000;
      }

      .main-player video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
      }

      .video-caption {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .collection {
        padding-top: 64px;
        scroll-margin-top: 76px;
      }

      .section-heading {
        margin-bottom: 22px;
      }

      .section-heading h2 {
        margin-bottom: 7px;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.035em;
      }

      .section-heading p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .interview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 26px 18px;
      }

      .interview-card { min-width: 0; }

      .interview-media {
        position: relative;
        display: grid;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        place-items: center;
        border-radius: 12px;
        background: #181818;
      }

      .interview-media iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .monogram {
        display: grid;
        width: 62px;
        height: 62px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        color: #111;
        font-size: 1.25rem;
        font-weight: 800;
      }

      .play-message {
        position: absolute;
        inset: 0;
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        place-items: center;
        gap: 12px;
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      .play-message::after {
        padding: 7px 11px;
        border-radius: 6px;
        background: var(--red);
        color: #fff;
        content: "Play";
        font-size: 0.82rem;
        font-weight: 700;
      }

      .play-message:hover { background: rgba(255, 255, 255, 0.06); }

      .interview-copy {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 2px 0;
      }

      .interview-copy h3 {
        margin-bottom: 4px;
        font-size: 1rem;
        line-height: 1.3;
      }

      .interview-copy p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .status {
        flex: 0 0 auto;
        padding: 4px 7px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .interview-card.is-live .status {
        background: #ffe5eb;
        color: #b00024;
      }

      footer {
        margin-top: 64px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
      }

      footer p { margin: 0; }

      :focus-visible {
        outline: 3px solid #065fd4;
        outline-offset: 3px;
      }

      @media (max-width: 820px) {
        .interview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 560px) {
        .header-inner,
        main { width: min(100% - 24px, 1120px); }

        nav { display: none; }
        main { padding-top: 28px; }
        .main-player { border-radius: 10px; }
        .collection { padding-top: 48px; }
        .interview-grid { grid-template-columns: 1fr; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
    </style>
  </head>
  <body id="top">
    <a class="skip-link" href="#birthday-film">Skip to the birthday film</a>

    <header>
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="AnushkaTube home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>AnushkaTube</span>
        </a>
        <nav aria-label="Page navigation">
          <a href="#full-messages">Full messages</a>
        </nav>
      </div>
    </header>

    <main>
      <section aria-labelledby="page-title">
        <p class="featured-label">Featured video</p>
        <h1 id="page-title">Anushka's Birthday</h1>

        <div class="main-player" id="birthday-film">
          <video controls playsinline preload="metadata" poster="media/poster.jpg">
            <source src="media/anushka-birthday-montage.mp4" type="video/mp4" />
            Your browser cannot play this video.
            <a href="media/anushka-birthday-montage.mp4">Download the viewing copy</a> instead.
          </video>
        </div>
        <p class="video-caption">The complete birthday film · 17 minutes</p>
      </section>

      <section class="collection" id="full-messages" aria-labelledby="messages-title">
        <div class="section-heading">
          <h2 id="messages-title">Full messages</h2>
          <p>Watch the full birthday messages from everyone in the film.</p>
        </div>

        <div class="interview-grid" id="interview-grid"></div>
      </section>

      <footer>
        <p>AnushkaTube · Made for Anushka's birthday</p>
      </footer>
    </main>

    <script>
      // Paste each YouTube URL into its youtubeUrl value when it is ready.
      const interviews = [
        { name: "Insiya", youtubeUrl: "https://www.youtube.com/watch?v=dr5fPSF-Rto" },
        { name: "Isha", youtubeUrl: "https://www.youtube.com/watch?v=_ehbOTRmBY0" },
        { name: "Kayla", youtubeUrl: "https://www.youtube.com/watch?v=yCffYpQdItY" },
        { name: "Ilana", youtubeUrl: "https://www.youtube.com/watch?v=23qbtzm93Pk" },
        { name: "Raina", youtubeUrl: "https://www.youtube.com/watch?v=Z7yQbtvrauQ" },
        { name: "Shivam", youtubeUrl: "" },
        { name: "Vaishali", youtubeUrl: "" },
      ];

      const toYouTubeId = (value) => {
        if (!value) return "";
        const trimmed = value.trim();
        if (/^[\w-]{11}$/.test(trimmed)) return trimmed;

        try {
          const url = new URL(trimmed);
          if (url.hostname === "youtu.be") return url.pathname.split("/").filter(Boolean)[0] || "";
          if (url.hostname.endsWith("youtube.com")) {
            if (url.pathname === "/watch") return url.searchParams.get("v") || "";
            const parts = url.pathname.split("/").filter(Boolean);
            if (["embed", "shorts", "live"].includes(parts[0])) return parts[1] || "";
          }
        } catch (_) {
          return "";
        }

        return "";
      };

      const grid = document.querySelector("#interview-grid");

      interviews.forEach((interview) => {
        const youtubeId = toYouTubeId(interview.youtubeUrl);
        const initials = interview.name.slice(0, 2).toUpperCase();
        const card = document.createElement("article");
        card.className = `interview-card${youtubeId ? " is-live" : ""}`;

        const media = document.createElement("div");
        media.className = "interview-media";

        const monogram = document.createElement("div");
        monogram.className = "monogram";
        monogram.setAttribute("aria-hidden", "true");
        monogram.textContent = initials;

        if (youtubeId) {
          const playButton = document.createElement("button");
          playButton.className = "play-message";
          playButton.type = "button";
          playButton.setAttribute("aria-label", `Play ${interview.name}'s full birthday message`);
          playButton.append(monogram);
          media.append(playButton);

          playButton.addEventListener("click", () => {
            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube-nocookie.com/embed/${youtubeId}?autoplay=1`;
            iframe.title = `${interview.name}'s full birthday message`;
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.allowFullscreen = true;
            media.replaceChildren(iframe);
          });
        } else {
          media.append(monogram);
        }

        const copy = document.createElement("div");
        copy.className = "interview-copy";
        copy.innerHTML = `
          <div>
            <h3>${interview.name}</h3>
            <p>Full birthday message</p>
          </div>
          <span class="status">${youtubeId ? "YouTube" : "Coming soon"}</span>
        `;

        card.append(media, copy);
        grid.append(card);
      });
    </script>
  </body>
</html>
